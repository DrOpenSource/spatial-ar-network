<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Living Landmarks | On-Site AR</title>
  <link rel="stylesheet" href="./src/style.css" />
</head>
<body>
  <!-- Rear camera feed, with the transparent 3D layer on top -->
  <video id="camera-feed" playsinline muted autoplay></video>
  <div id="ar-container"></div>

  <div id="ui-overlay">
    <header class="hud-header">
      <button class="hud-location-chip" id="hud-location-chip" aria-label="Switch Landmark">
        <span class="location-icon">📍</span>
        <span class="location-title" id="landmark-name">QUTUB MINAR · MEHRAULI</span>
        <span class="location-caret">▾</span>
      </button>
      <div class="hud-header-actions">
        <div class="hud-status-chip" id="tracking-status">READY</div>
        <button class="hud-icon-btn" id="btn-studio-toggle" title="Spec Studio" aria-label="Open Spec Studio">⚙️</button>
      </div>
    </header>

    <!-- Off-target radar pill: appears when looking away from the physical landmark -->
    <div class="target-radar-pill" id="target-radar-pill" hidden>
      <span class="radar-arrow" id="radar-arrow">←</span>
      <span class="radar-label" id="radar-label">3D TWIN ACTIVE</span>
    </div>

    <!-- Aiming crosshair: the user puts this on the top of the real tower, then taps Lock -->
    <div class="aim-crosshair" id="aim-crosshair" hidden>
      <span class="aim-ring"></span>
    </div>

    <footer class="hud-footer" id="hud-footer">
      <!-- Drawer Handle & Drag Pill -->
      <div class="drawer-handle-bar" id="footer-collapse-btn" role="button" aria-expanded="true" aria-label="Toggle Controls Drawer">
        <span class="drawer-drag-pill"></span>
        <div class="drawer-handle-row">
          <span class="drawer-handle-title">MISSION CONTROLS</span>
          <span class="drawer-handle-toggle" id="drawer-toggle-label">COLLAPSE ▼</span>
        </div>
      </div>

      <div class="stunt-actions-row" id="stunt-actions-row">
        <button class="btn btn-stunt" id="btn-stunt-trigger" aria-label="Trigger Interactive Stunt">
          <span class="stunt-icon">⚡</span>
          <span class="stunt-label" id="stunt-label">BOSS RAID</span>
        </button>
        <button class="btn btn-capture" id="btn-capture-drop" aria-label="Capture AR Drop" title="Capture AR Drop for TikTok / IG">
          <span class="capture-icon">📸</span>
          <span class="capture-label">CAPTURE</span>
        </button>
      </div>

      <div class="drawer-collapsible-body" id="drawer-collapsible-body">
        <div class="cta-content">
          <span class="cta-kicker" id="geo-kicker">GPS LANDMARK LOCK</span>
          <h3 class="cta-headline" id="geo-headline">Stand where you can see the landmark</h3>
          <p class="cta-subtext" id="geo-subtext">We find you with GPS, then you confirm the structure with one tap.</p>
        </div>

        <!-- View switcher: appears once locked on landmark -->
        <div class="view-toggle-row" id="view-toggle-row" hidden>
          <button class="view-toggle-btn active" id="btn-view-auto">Auto View</button>
          <button class="view-toggle-btn" id="btn-view-camera">Camera AR</button>
          <button class="view-toggle-btn" id="btn-view-twin">3D Twin</button>
        </div>

        <div class="landmark-picker-row">
          <select class="hud-select country-select" id="country-select" aria-label="Choose a country"></select>
          <select class="hud-select landmark-select" id="landmark-select" aria-label="Choose a landmark"></select>
        </div>
        <p class="geo-readout" id="geo-readout"></p>
        <div class="cta-actions">
          <button class="btn btn-primary" id="btn-geo-action">Start AR</button>
          <a class="btn btn-secondary" id="btn-virtual-view" href="./virtual.html">Virtual Tour</a>
        </div>
        <p class="model-credit" id="model-credit"></p>
      </div>
    </footer>
  </div>

  <!-- Spec Studio / Admin Control Drawer -->
  <aside class="admin-drawer" id="admin-drawer" aria-label="Brand Studio Admin">
    <div class="admin-drawer-header">
      <div class="admin-drawer-title">
        <span class="studio-badge">ADMIN</span>
        <h3>Brand Spec Studio</h3>
      </div>
      <button class="btn-close-studio" id="btn-close-studio" aria-label="Close studio">✕</button>
    </div>

    <div class="admin-drawer-content">
      <div class="studio-section">
        <label class="studio-label" for="studio-asset-select">Active 3D Aerial Fleet</label>
        <select class="hud-select studio-select" id="studio-asset-select"></select>
      </div>

      <div class="studio-section">
        <label class="studio-label">Spatial AR Color Themes</label>
        <div class="studio-presets-row" id="studio-presets-row"></div>
        <div class="studio-color-pickers">
          <label class="studio-color-label">Beacon & Trails: <input type="color" id="studio-primary-color" value="#00f0ff" /></label>
          <label class="studio-color-label">Crown Halo: <input type="color" id="studio-accent-color" value="#ffb800" /></label>
        </div>
      </div>

      <div class="studio-section">
        <div class="studio-slider-header">
          <label class="studio-label" for="studio-speed-slider">Orbit Velocity</label>
          <span class="studio-val" id="studio-speed-val">1.0x</span>
        </div>
        <input type="range" class="studio-slider" id="studio-speed-slider" min="0.2" max="2.5" step="0.1" value="1.0" />
      </div>

      <div class="studio-section">
        <div class="studio-slider-header">
          <label class="studio-label" for="studio-radius-slider">Orbit Radius</label>
          <span class="studio-val" id="studio-radius-val">1.0x</span>
        </div>
        <input type="range" class="studio-slider" id="studio-radius-slider" min="0.5" max="2.0" step="0.1" value="1.0" />
      </div>

      <div class="studio-section">
        <label class="studio-label" for="studio-kicker-input">Custom Campaign Kicker</label>
        <input type="text" class="studio-text-input" id="studio-kicker-input" placeholder="e.g. RED BULL ENDLESS DROP" />
      </div>

      <div class="studio-actions">
        <button type="button" class="btn btn-secondary" id="btn-reset-studio">Reset to Default</button>
      </div>
    </div>
  </aside>

  <script type="module" src="./src/geo.js"></script>
</body>
</html>
